<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D酱 · 门</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0b1620;color:#e6f2f8;font:16px system-ui;text-align:center}
a{display:inline-block;margin-top:14px;padding:12px 24px;border-radius:14px;background:#3f9fbe;color:#04151d;text-decoration:none;font-weight:700}
small{color:#8ea9b8}</style>
<h2>D酱 · 门</h2><small id="tip">正在找门…</small><div><a id="go" href="#" style="display:none">进去</a></div>
<script>(async()=>{const t=document.getElementById('tip');try{const r=await fetch('./url.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.url)throw 0;t.textContent='门在这儿：'+d.url.replace('https://','');const a=document.getElementById('go');a.href=d.url;a.style.display='inline-block';setTimeout(()=>location.replace(d.url),700)}catch(e){t.textContent='地址还没写好，等会儿再刷新'}})()</script>
