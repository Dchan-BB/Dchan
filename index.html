<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D酱 · 门</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background: radial-gradient(120% 90% at 50% 0%, #123244 0%, #0b1620 55%, #060d13 100%);
    color:#e6f2f8; font:16px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding: 28px 22px; }
  h1 { font-size: 22px; letter-spacing:.18em; font-weight: 600; margin: 0 0 6px; }
  .sub { color:#8ea9b8; font-size: 12.5px; letter-spacing:.08em; margin-bottom: 26px; }
  .cards { display:grid; gap: 14px; width: min(360px, 86vw); margin: 0 auto; }
  a.card { display:block; padding: 18px 20px; border-radius: 16px; text-decoration:none; color:#eaf7fd;
    background: rgba(12,30,42,.86); border: 1px solid rgba(120,200,225,.28); transition: .18s; }
  a.card:hover { background: rgba(63,159,190,.24); border-color: rgba(160,225,245,.65); }
  a.card .t { font-size: 16px; font-weight: 600; }
  a.card .d { font-size: 12.5px; color:#8fb4c4; margin-top: 4px; }
  a.card.off { opacity: .45; pointer-events: none; }
  .tip { color:#6f93a3; font-size: 12px; margin-top: 22px; min-height: 18px; }
</style>
<div class="wrap">
  <h1>D酱 · 门</h1>
  <div class="sub">私人深海入口</div>
  <div class="cards">
    <a class="card" id="chat" href="#"><div class="t">进来聊天</div><div class="d" id="chatSub">手机 / 电脑都行</div></a>
    <a class="card off" id="game" href="#"><div class="t">玩《请把我装进你的电脑》</div><div class="d">第一章 · 第二章 已就绪</div></a>
  </div>
  <div class="tip" id="tip">正在找门…</div>
</div>
<script>
(async () => {
  const tip = document.getElementById('tip');
  const chat = document.getElementById('chat');
  const game = document.getElementById('game');
  try {
    const r = await fetch('./url.json?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    if (!d.url) throw new Error('no url');
    const base = d.url.replace(/\/+$/, '');
    tip.textContent = '门在这儿：' + base.replace('https://', '');
    chat.href = base + '/';
    game.href = base + '/game/';
    game.classList.remove('off');
    document.getElementById('chatSub').textContent = '登录后进聊天页';
  } catch (e) {
    tip.textContent = '地址还没写好，等会儿再刷新';
  }
})();
</script>
